<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Gym Manager</title>
<style>
:root{--bg:#f5f6f8;--cd:#fff;--tx:#14171c;--mu:#6b7280;--ac:#e8590c;--bd:#e3e5e9;--ok:#2f9e44;--wa:#d97706;--ba:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--cd:#1a1d23;--tx:#eef0f3;--mu:#9aa1ad;--bd:#2a2e36;--ok:#51cf66;--wa:#fcc419;--ba:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0f1115;--cd:#1a1d23;--tx:#eef0f3;--mu:#9aa1ad;--bd:#2a2e36;--ok:#51cf66;--wa:#fcc419;--ba:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.sw{display:flex;background:var(--cd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.sw button{border:0;background:none;color:var(--mu);padding:8px 12px;font:inherit;font-weight:600}
.sw .on{background:var(--ac);color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:7px 14px;font:inherit}
nav .on{background:var(--tx);color:var(--bg)}
main{padding:6px 14px 40px;max-width:820px;margin:auto}
h2{margin:10px 0}h3{margin:0 0 8px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.k,.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.k small{display:block;color:var(--mu)}.k b{font-size:21px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{display:block;color:var(--mu)}
.act{display:flex;gap:6px;flex-wrap:wrap}
.b{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-weight:600}
.b.s{background:var(--bd);color:var(--tx)}.b.d{background:none;color:var(--ba);border:1px solid var(--ba)}
.t{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff}
.ok{background:var(--ok)}.warn{background:var(--wa)}.bad{background:var(--ba)}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
.mo{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--cd);border-radius:14px;padding:16px;width:100%;max-width:400px;max-height:90%;overflow:auto}
.md label{display:block;color:var(--mu);font-size:13px}.r{display:flex;gap:8px;justify-content:flex-end}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.in{color:var(--ok)}.out{color:var(--ba)}.dots{display:flex;gap:6px}.dots i{width:28px;height:28px;border-radius:50%;background:var(--bd);font:600 12px/28px system-ui;text-align:center;color:var(--mu)}.dots i.y{background:var(--ok);color:#fff}
.hint{color:var(--mu);margin:0 0 4px}.sec{font-weight:700;margin:16px 0 2px;color:var(--ac)}</style></head><body><div id="app"></div>
<script>
const K="gymv4",td=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2,8);
const ad=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dl=d=>Math.ceil((new Date(d)-new Date(td()))/864e5),$=n=>(S.cfg?S.cfg.cur:"$")+Math.round(n).toLocaleString("es");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function seed(){const t=td();return{
cfg:{name:"Gym Manager",emoji:"🏋️",cur:"$",color:"#e8590c",ee:2.5,er:20},plans:[{id:"p1",name:"Mensual",price:400,days:30}],
members:[],
staff:[{id:"s1",name:"Recepcionista",role:"Recepción",rfc:"",curp:"",nss:"",ct:"Indefinido",freq:"Mensual",start:td(),salary:8000,bonus:0,ee:2.5,er:20,inf:0,hp:"",hc:0,vt:0,last:"",agY:0},{id:"s2",name:"Instructor",role:"Instructor",rfc:"",curp:"",nss:"",ct:"Indefinido",freq:"Mensual",start:td(),salary:9000,bonus:0,ee:2.5,er:20,inf:0,hp:"",hc:0,vt:0,last:"",agY:0}],

cls:[{id:"c1",name:"Box (clase extra)",coach:"Instructor",day:"Sábado",time:"10:00",cap:10,price:100,bk:[]}],
pay:[]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();S.cfg=S.cfg||seed().cfg;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let fm="",mf="all",role="admin",tab="dash",q="",me=S.members[0]?.id;
const TABS={dash:"📊 Resumen",mem:"👥 Clientes",cls:"🗓️ Actividades",stf:"👷 Empleados",fin:"💰 Dinero",pln:"🏷️ Planes",cfg:"⚙️ Ajustes"},HINT={dash:"Cómo va el gimnasio este mes y lo que necesita atención.",mem:"Clientes del gimnasio: marca cuándo entran y salen. Su membresía se renueva sola cuando pagan.",cls:"Clases y actividades: toca una para ver quién se apuntó. Puedes ponerles costo extra.",stf:"Tus empleados: toca uno para ver su IMSS y prestaciones. Sus pagos se registran solos en Dinero.",fin:"Reporte mensual: ingresos, gastos y utilidad. Se puede descargar en CSV.",pln:"Precios de las membresías.",cfg:"Personaliza tu gimnasio: nombre, moneda, color y porcentajes."};
const P=id=>S.plans.find(p=>p.id==id)||{name:"—",price:0,days:30};
const st=m=>{const d=dl(m.end);return d<0?["Vencida","bad"]:d<=7?["Por vencer","warn"]:["Activa","ok"]};
const tag=a=>`<span class="t ${a[1]}">${a[0]}</span>`;
const pay=(type,concept,amt)=>S.pay.unshift({id:uid(),date:td(),type,concept,amt:Math.round(+amt)});
const mo=()=>td().slice(0,7);
function form(t,f,cb){const m=document.createElement("div");m.className="mo";
m.innerHTML=`<div class="md"><h3>${t}</h3>${f.map(x=>`<label>${x.l}${x.o?`<select name="${x.k}">${x.o.map(o=>`<option value="${o[0]}" ${o[0]==x.v?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`:`<input name="${x.k}" type="${x.t||"text"}" value="${esc(x.v??"")}">`}</label>`).join("")}<div class="r"><button class="b s" id="c">Cancelar</button><button class="b" id="s">Guardar</button></div></div>`;
document.body.appendChild(m);m.querySelector("#c").onclick=()=>m.remove();
m.querySelector("#s").onclick=()=>{const v={};m.querySelectorAll("[name]").forEach(e=>v[e.name]=e.value.trim());m.remove();cb(v);save();render()}}
const po=()=>S.plans.map(p=>[p.id,`${p.name} · ${$(p.price)}`]);

function vl(d){return{in:d+"T14:00:00.000Z",out:d+"T15:15:00.000Z"}}
const vis=m=>m.log||[],inside=m=>{const l=vis(m).at(-1);return l&&!l.out?l:null},vd=m=>vis(m).map(v=>v.in.slice(0,10)),hm=i=>new Date(i).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
function entrada(id){const m=S.members.find(x=>x.id==id);if(dl(m.end)<0)return say("Su membresía está vencida. Debe pagar antes de entrar.");if(inside(m))return;m.log=vis(m);m.log.push({in:new Date().toISOString(),out:null});save();render()}
function salida(id){const m=S.members.find(x=>x.id==id),l=inside(m);if(l){l.out=new Date().toISOString();save();render()}}
function pagar(id){const m=S.members.find(x=>x.id==id);form("Pagar membresía",[{k:"p",l:"Plan",o:po(),v:m.plan},{k:"w",l:"Forma de pago",o:["Tarjeta","Transferencia","Pago en línea"].map(x=>[x,x])}],v=>{const p=P(v.p);m.plan=p.id;m.end=ad(dl(m.end)>0?m.end:td(),p.days);pay("in",`${p.name} ${m.name}`,p.price);Object.assign(S.pay[0],{by:"cliente",method:v.w,mid:m.id});say(`¡Pago recibido! ${$(p.price)} · tu membresía ${p.name} vence el ${m.end}.`)})}
function del(k,id){ask("¿Eliminar este registro?",()=>{S[k]=S[k].filter(x=>x.id!=id);save();render()})}
function addMem(){form("Nuevo miembro",[{k:"n",l:"Nombre"},{k:"t",l:"Teléfono"},{k:"p",l:"Plan",o:po()}],v=>{if(!v.n)return;const p=P(v.p);S.members.push({id:uid(),name:v.n,phone:v.t,plan:p.id,end:ad(td(),p.days),log:[]});pay("in",`${p.name} ${v.n}`,p.price)})}






function delMov(id){ask("¿Quitar este movimiento?",()=>{S.pay=S.pay.filter(p=>p.id!=id);save();render()})}
function addMov(){form("Movimiento",[{k:"t",l:"Tipo",o:[["in","Ingreso"],["out","Gasto"]]},{k:"c",l:"Concepto"},{k:"a",l:"Monto",t:"number"}],v=>v.c&&pay(v.t,v.c,v.a))}

const byName=(a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"});
const mlist=()=>[...S.members].sort(byName).filter(m=>m.name.toLowerCase().includes(q.toLowerCase())).filter(m=>mf=="all"||(mf=="act"&&dl(m.end)>=0)||(mf=="ren"&&dl(m.end)>=0&&dl(m.end)<=7)||(mf=="ven"&&dl(m.end)<0)).map(m=>{const i=inside(m),hoy=vis(m).filter(v=>v.in.startsWith(td())).map(v=>hm(v.in)+"–"+(v.out?hm(v.out):"…")).join(", ");return`<div class="row"><div><b>${esc(m.name)}</b> ${tag(st(m))}${i?tag(["Dentro","ok"]):""}<small>${P(m.plan).name} · vence ${m.end} · ${esc(m.phone||"")}</small>${hoy?`<small>Hoy: ${hoy}</small>`:""}</div><div class="act">${i?`<button class="b s" onclick="salida('${m.id}')">Marcar salida</button>`:`<button class="b" onclick="entrada('${m.id}')">Marcar entrada</button>`}<button class="b d" onclick="del('members','${m.id}')">✕</button></div></div>`}).join("")||"<small>Sin resultados</small>";
const sum=t=>S.pay.filter(p=>p.type==t&&p.date.startsWith(mo())).reduce((a,p)=>a+p.amt,0);
const V={
dash(){const a=S.members.filter(m=>dl(m.end)>=0),ex=a.filter(m=>dl(m.end)<=7),inc=sum("in"),out=sum("out");
return`<h2>Resumen del mes</h2><div class="g"><div class="k"><small>Miembros activos</small><b>${a.length}</b></div><div class="k"><small>Dentro ahora</small><b>${S.members.filter(inside).length}</b></div><div class="k"><small>Ingresos</small><b class="in">${$(inc)}</b></div><div class="k"><small>Gastos</small><b class="out">${$(out)}</b></div></div><div class="k"><small>Utilidad del mes (ingresos − gastos)</small><b>${$(inc-out)}</b></div>
<div class="cd"><h3>🟢 En el gimnasio ahora</h3>${S.members.filter(inside).map(m=>`<div class="row"><div><b>${esc(m.name)}</b><small>Entró a las ${hm(inside(m).in)}</small></div><button class="b s" onclick="salida('${m.id}')">Marcar salida</button></div>`).join("")||"<small>Nadie por ahora</small>"}</div>
<div class="cd"><h3>💳 Pagos recientes de clientes</h3>${S.pay.filter(p=>p.by).slice(0,5).map(p=>`<div class="row"><div>${esc(p.concept)}<small>${p.date} · ${esc(p.method)} · ${p.concept.includes("(extra)")?"actividad extra":"membresía renovada automáticamente"}</small></div><b class="in">+${$(p.amt)}</b></div>`).join("")||"<small>Aún no hay pagos de clientes</small>"}</div>
<div class="cd"><h3>Alertas</h3>${[...ex.map(m=>`Membresía de ${esc(m.name)} vence en ${dl(m.end)} días`),...S.members.filter(m=>dl(m.end)<0).map(m=>`${esc(m.name)}: membresía vencida`),...S.staff.filter(s=>!s.nss).map(s=>`${esc(s.name)} no está dado de alta en el IMSS`)].map(x=>`<div class="row">⚠️ ${x}</div>`).join("")||"<small>Todo al día ✓</small>"}</div>`},
mem(){return`<h2>Clientes</h2><div class="act"><button class="b" onclick="addMem()">+ Nuevo</button><button class="b s" onclick="expMem()">⬇️ CSV</button></div><div class="act" style="margin-top:8px">${[["all","Todos"],["act","Activos"],["ren","Por renovar"],["ven","Vencidos"]].map(f=>`<button class="b ${mf==f[0]?"":"s"}" onclick="mf='${f[0]}';render()">${f[1]}</button>`).join("")}</div><input placeholder="Buscar..." value="${esc(q)}" oninput="q=this.value;document.getElementById('ml').innerHTML=mlist()" style="margin-top:10px"><div class="cd" id="ml">${mlist()}</div>`},
cls(){return`<h2>Actividades</h2><button class="b" onclick="clsForm()">+ Nueva</button><div class="cd" style="margin-top:10px">${S.cls.map(c=>`<div class="row"><div style="cursor:pointer;flex:1" onclick="roster('${c.id}')"><b>${esc(c.name)}</b> ${c.price?tag([$(c.price)+" extra","warn"]):tag(["Incluida","ok"])}<small>${esc(c.day)} ${c.time} · ${esc(c.coach)}</small><b>👥 ${c.bk.length} de ${c.cap}</b><small>👆 Toca para ver quién va</small></div><div class="act"><button class="b s" onclick="clsForm('${c.id}')">Editar</button><button class="b d" onclick="del('cls','${c.id}')">✕</button></div></div>`).join("")||"<small>No hay actividades</small>"}</div>`},
stf(){return`<h2>Empleados</h2><div class="g"><div class="k"><small>Empleados</small><b>${S.staff.length}</b></div><div class="k"><small>Costo mensual total</small><b>${$(S.staff.reduce((a,s)=>a+cost(s),0))}</b></div></div><button class="b" onclick="stForm()">+ Empleado</button><div class="cd" style="margin-top:10px">${S.staff.map(s=>`<div class="row"><div style="cursor:pointer;flex:1" onclick="ficha('${s.id}')"><b>${esc(s.name)}</b> ${tag(["Pagado","ok"])}${s.nss?"":tag(["Sin IMSS","bad"])}<small>${esc(s.role)} · pago ${esc(s.freq).toLowerCase()} · neto ${$(net(s)*fr(s))}</small><small>👆 Toca para ver su ficha completa</small></div><div class="act"><button class="b d" onclick="del('staff','${s.id}')">✕</button></div></div>`).join("")}</div>`},

fin(){const m=fm||mo(),ms=[...new Set([mo(),...S.pay.map(p=>p.date.slice(0,7))])].sort().reverse(),L=S.pay.filter(p=>p.date.startsWith(m)),T=t=>L.filter(p=>p.type==t).reduce((a,p)=>a+p.amt,0),nom=p=>/^(Sueldo|IMSS|Seguro|Aguinaldo)/.test(p.concept),ex=p=>p.concept.includes("(extra)"),sm=a=>a.reduce((x,p)=>x+p.amt,0),inM=L.filter(p=>p.type=="in"),out=L.filter(p=>p.type=="out"),ent=S.members.reduce((a,c)=>a+vd(c).filter(d=>d.startsWith(m)).length,0),u=T("in")-T("out");
return`<h2>Dinero y reporte mensual</h2><select onchange="fm=this.value;render()">${ms.map(x=>`<option value="${x}" ${x==m?"selected":""}>${x}</option>`).join("")}</select><div class="g"><div class="k"><small>Ingresos</small><b class="in">${$(T("in"))}</b></div><div class="k"><small>Gastos</small><b class="out">${$(T("out"))}</b></div></div><div class="k"><small>Utilidad (ingresos − gastos)</small><b class="${u<0?"out":"in"}">${$(u)}</b></div>
<div class="cd"><h3>Resumen de ${m}</h3><div class="row"><div>Membresías</div><b>${$(sm(inM.filter(p=>!ex(p))))}</b></div><div class="row"><div>Actividades extra</div><b>${$(sm(inM.filter(ex)))}</b></div><div class="row"><div>Nómina, IMSS y seguros</div><b>${$(sm(out.filter(nom)))}</b></div><div class="row"><div>Otros gastos</div><b>${$(sm(out.filter(p=>!nom(p))))}</b></div><div class="row"><div>Entradas al gimnasio</div><b>${ent}</b></div></div>
<div class="act"><button class="b" onclick="addMov()">+ Movimiento</button><button class="b s" onclick="expMov('${m}')">⬇️ Descargar CSV del mes</button></div><div class="cd" style="margin-top:10px"><h3>Movimientos</h3>${L.map(p=>`<div class="row"><div>${esc(p.concept)}<small>${p.date}${p.by?" · pagó el cliente ("+esc(p.method)+")":""}${p.auto?" · pago automático":""}</small></div><div class="act" style="align-items:center"><b class="${p.type}">${p.type=="in"?"+":"−"}${$(p.amt)}</b><button class="b d" onclick="delMov('${p.id}')">✕</button></div></div>`).join("")||"<small>Sin movimientos este mes</small>"}</div>`},
pln(){return`<h2>Planes y precios</h2><button class="b" onclick="planForm()">+ Plan</button><div class="cd" style="margin-top:10px">${S.plans.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>${$(p.price)} · ${p.days} días</small></div><div class="act"><button class="b s" onclick="planForm('${p.id}')">Editar precio</button><button class="b d" onclick="del('plans','${p.id}')">✕</button></div></div>`).join("")}</div>`},
cfg(){const c=S.cfg;return`<h2>Ajustes del gimnasio</h2><div class="cd"><h3>${c.emoji} ${esc(c.name)}</h3><small>Moneda ${esc(c.cur)} · seguro social por defecto: empleado ${c.ee}%, gimnasio ${c.er}%</small><div class="act" style="margin-top:10px"><button class="b" onclick="cfgForm()">Editar datos del gimnasio</button></div></div><div class="cd"><h3>Precios</h3><small>Membresías: pestaña 🏷️ Planes. Costo extra de actividades: pestaña 🗓️ Actividades (botón Editar).</small></div><div class="cd"><h3>Archivos CSV</h3><small>Descarga tus registros para abrirlos en Excel o guardarlos como respaldo.</small><div class="act" style="margin-top:10px"><button class="b s" onclick="expMem()">⬇️ Clientes</button><button class="b s" onclick="expMov(mo())">⬇️ Movimientos del mes</button><button class="b s" onclick="expStaff()">⬇️ Empleados</button><button class="b s" onclick="expVis()">⬇️ Entradas y salidas</button><button class="b" onclick="impMem()">⬆️ Importar clientes (CSV)</button></div><small style="margin-top:8px">Para importar: columnas Nombre, Teléfono, Plan y Vence (AAAA-MM-DD), igual que el archivo de clientes descargado.</small></div>
<div class="cd"><h3>Aviso importante</h3><small>Este programa aún no emite CFDI y no sustituye la asesoría fiscal o contable (IVA e ISR según tu régimen). Los datos personales de clientes y empleados se guardan solo en este dispositivo; el gimnasio es responsable de su aviso de privacidad y del uso de esos datos.</small></div>
<div class="cd"><h3>Datos de ejemplo</h3><small>Llena la página con clientes, empleados y pagos inventados para probarla o hacer una demostración.</small><div class="act" style="margin-top:10px"><button class="b s" onclick="randomData()">🎲 Cargar datos de ejemplo</button></div></div>
<div class="cd"><h3>Empezar de cero</h3><small>Borra todo y deja solo lo básico para cargar los datos de tu gimnasio.</small><div class="act" style="margin-top:10px"><button class="b d" onclick="emptyData()">Volver al inicio</button></div></div>`}};
function client(){const m=S.members.find(x=>x.id==me)||S.members[0];if(!m)return"<h2>Sin clientes</h2>";me=m.id;
const s=st(m),p=P(m.plan),d=dl(m.end),pc=Math.max(0,Math.min(100,d/p.days*100)),i=inside(m),ds=vd(m),mm=ds.filter(x=>x.startsWith(mo())).length,l7=[...Array(7)].map((_,k)=>ad(td(),k-6)),wd=x=>"DLMMJVS"[new Date(x+"T12:00").getDay()],mine=S.pay.filter(x=>x.mid==m.id||(x.type=="in"&&x.concept.endsWith(m.name))),ult=ds.at(-1);
return`<small>Demostración: elige qué cliente ver</small><select onchange="me=this.value;render()">${[...S.members].sort(byName).map(x=>`<option value="${x.id}" ${x.id==me?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
<div class="cd"><h2 style="margin:0">Hola, ${esc(m.name.split(" ")[0])} 👋</h2><small>${i?"🟢 Estás dentro del gimnasio desde las "+hm(i.in):"Aún no estás dentro del gimnasio"}</small></div>
